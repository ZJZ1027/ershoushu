<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Admin Pro 管理后台 Vue3 Vite TypeScript Arco Design Vue Spring Boot 多租户"
    />
    <meta
      name="description"
      content="Admin Pro：基于 Vue 3 + Vite + Arco Design Vue 与 Spring Boot 的多租户后台管理基础框架。"
    />
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          position: relative;
          display: flex;
          width: 100%;
          height: 100vh;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          overflow: hidden;
          background: radial-gradient(1200px 620px at 50% -12%, #e8f1ff 0%, #f4f8ff 42%, #eef1f6 100%);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
            'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
        }

        /* 背景装饰光斑：低透明度品牌色，制造层次与呼吸感 */
        .app-loading .app-loading-blob {
          position: absolute;
          border-radius: 50%;
          filter: blur(60px);
          opacity: 0.55;
          pointer-events: none;
        }
        .app-loading .app-loading-blob.b1 {
          top: -120px;
          left: -80px;
          width: 360px;
          height: 360px;
          background: radial-gradient(circle at 30% 30%, #4c9bff 0%, rgba(76, 155, 255, 0) 70%);
          animation: blob-float 9s ease-in-out infinite;
        }
        .app-loading .app-loading-blob.b2 {
          right: -120px;
          bottom: -120px;
          width: 420px;
          height: 420px;
          background: radial-gradient(circle at 60% 40%, #7fd0ff 0%, rgba(127, 208, 255, 0) 70%);
          animation: blob-float 11s ease-in-out infinite reverse;
        }

        .app-loading .app-loading-wrap {
          position: relative;
          z-index: 1;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }

        /* Logo：光晕托底 + 轻微浮动，呼应系统「玻璃质感」品牌调性 */
        .app-loading .app-loading-logo-wrap {
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          margin-bottom: 22px;
          animation: logo-float 3.2s ease-in-out infinite;
        }
        .app-loading .app-loading-logo-wrap::before {
          content: '';
          position: absolute;
          width: 128px;
          height: 128px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(45, 140, 240, 0.28) 0%, rgba(45, 140, 240, 0) 68%);
          animation: glow-pulse 3.2s ease-in-out infinite;
        }
        .app-loading .app-loading-logo {
          position: relative;
          width: 84px;
          height: 84px;
          border-radius: 22px;
          box-shadow: 0 14px 34px rgba(45, 140, 240, 0.36), 0 2px 8px rgba(15, 23, 42, 0.1);
        }

        .app-loading .app-loading-title {
          font-size: 22px;
          font-weight: 700;
          letter-spacing: 1px;
          color: #1d2129;
          text-align: center;
        }
        .app-loading .app-loading-sub {
          margin-top: 7px;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 3.5px;
          text-transform: uppercase;
          color: #86909c;
        }

        /* Spinner：锥形渐变 + 圆形遮罩，得到一条渐隐的品牌色弧线，比双环更干净 */
        .app-loading .app-loading-spinner {
          width: 34px;
          height: 34px;
          margin-top: 34px;
          border-radius: 50%;
          background: conic-gradient(from 90deg, rgba(45, 140, 240, 0) 8%, #2d8cf0 100%);
          -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
          mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
          animation: spin 0.9s linear infinite;
        }
        .app-loading .app-loading-tip {
          margin-top: 16px;
          font-size: 12.5px;
          letter-spacing: 0.5px;
          color: #a5abb6;
          animation: tip-fade 1.8s ease-in-out infinite;
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
        @keyframes logo-float {
          0%,
          100% {
            transform: translateY(0);
          }
          50% {
            transform: translateY(-8px);
          }
        }
        @keyframes glow-pulse {
          0%,
          100% {
            transform: scale(0.92);
            opacity: 0.7;
          }
          50% {
            transform: scale(1.12);
            opacity: 1;
          }
        }
        @keyframes blob-float {
          0%,
          100% {
            transform: translate(0, 0) scale(1);
          }
          50% {
            transform: translate(24px, 30px) scale(1.08);
          }
        }
        @keyframes tip-fade {
          0%,
          100% {
            opacity: 0.5;
          }
          50% {
            opacity: 1;
          }
        }

        /* 尊重系统「减少动态效果」偏好 */
        @media (prefers-reduced-motion: reduce) {
          .app-loading * {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
          }
          .app-loading .app-loading-spinner {
            animation: spin 0.9s linear infinite !important;
          }
        }
      </style>
      <div class="app-loading">
        <span class="app-loading-blob b1"></span>
        <span class="app-loading-blob b2"></span>
        <div class="app-loading-wrap">
          <div class="app-loading-logo-wrap">
            <img src="/logo.png" class="app-loading-logo" alt="Logo" />
          </div>
          <div class="app-loading-title">%VITE_APP_TITLE%</div>
          <div class="app-loading-sub">Admin Pro</div>
          <div class="app-loading-spinner"></div>
          <div class="app-loading-tip">正在加载，请稍候…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
